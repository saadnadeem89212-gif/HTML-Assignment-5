<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <br>
<label>
    Roll no: <input type="text" size="20">
    <br>
    <br>
</label>
<label>
    Student Name: <input type="text" placeholder="first name"> - <input type="text"
    placeholder="last name">
</label>
<br><br>
<label>
    Father Name: <input type="text" size="20">
</label>
<br>
<br>
<label>
    Date of Birth: <input type="date">
</label>
<br>
<br>
<label>
    Mobile No: <select name="+92" id="+92">
        <option value="+91">+91</option>
        <option value="+92">+92</option>
        <option value="+44">+44</option>
        <option value="+7">+7</option>
        <option value="+61">+61</option>
        <option value="+1">+1</option>
        <option value="+51">+51</option>
    </select>
    - <input type="number">

</label>
<br>
<br>
<label>
    Email id: <input type="text">
</label>
<br><br>
<label>
    Password: <input type="password" >
</label>
<br>
<br>
<label>
    Gender: <input type="radio" name="gender" id="ma">Male
    <input type="radio" name="gender" id="fe">Female
    
</label>
<br>
<br>
<label>
   Department: <input type="checkbox">CSE<input type="checkbox">IT<input type="checkbox">ECE<input type="checkbox">Cvil
   <input type="checkbox">Mesh
</label>
<br>
<br>
<label>
    Course:
    <select name="Modern Web Development" id="MWD">
        <option value="MWD">Modern Web Development </option>
        <option value="AI">AI Course</option>
        <option value="Math">Mathematics Course</option>
        <option value="Eng">Engineering Course</option>
        <option value="Doc">Doctor Course</option>
    </select>
</label>
<br>
<br>
<label>
  Student Photo: <input type="file">  
</label>
<br>
<br>
<label>
    City: <input type="text" size="20">
</label>
<br>
<br>
<label >
    Address: <textarea name="" id="" cols="30" rows="4"></textarea>
</label>
<br>
<br>
<left>
    <button>Register</button>
</left>
</body>
</html>
